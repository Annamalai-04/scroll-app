name: Full Release

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # ANDROID
  # Build signed APK and upload to S3
  # ============================================================
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > scrollapplication-release

      - name: Build signed APK
        working-directory: scrollme
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/scrollapplication-release
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload APK to S3
        run: |
          aws s3 cp \
            scrollme/app/build/outputs/apk/release/app-release.apk \
            s3://my-scroll-videos-2026/apk/app-release.apk


  # ============================================================
  # SPRING BOOT
  # Maven build → Docker build → Docker Hub
  # ============================================================
  backend-build:
    name: Build Spring Boot Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Spring Boot
        working-directory: backends/scrollserver/server
        run: |
          chmod +x mvnw || true
          ./mvnw clean package -DskipTests || mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t annamalaikumar/scrollserver:${{ github.sha }} \
            -t annamalaikumar/scrollserver:latest \
            ./backends/scrollserver/server

      - name: Push Docker image
        run: |
          docker push annamalaikumar/scrollserver:${{ github.sha }}
          docker push annamalaikumar/scrollserver:latest


  # ============================================================
  # DEPLOY TO AWS EC2 / K3S
  # ============================================================
  deploy-backend:
    name: Deploy Backend to K3s
    runs-on: ubuntu-latest

    needs:
      - backend-build

    steps:

      - name: Deploy to EC2 K3s
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |

          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/scrollserver.pem

          chmod 600 ~/.ssh/scrollserver.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/scrollserver.pem \
            "$EC2_USERNAME@$EC2_HOST" << 'EOF'

            set -e

            echo "Pulling latest Docker image..."

            sudo k3s ctr images pull \
              docker.io/annamalaikumar/scrollserver:${GITHUB_SHA}

            echo "Updating Kubernetes deployment..."

            sudo kubectl set image deployment/scrollserver \
              scrollserver=annamalaikumar/scrollserver:${GITHUB_SHA}

            echo "Waiting for rollout..."

            sudo kubectl rollout status deployment/scrollserver \
              --timeout=180s

            echo "Current deployment:"

            sudo kubectl get pods

            echo "Backend deployment completed."

          EOF